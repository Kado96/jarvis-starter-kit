# ============================================================
# render.yaml — Deploiement Evolution API sur Render
# Service: jarvis-evolution-api
# Region: Frankfurt (EU, plus proche de Burundi)
# Plan: Free
# NOTE: Evolution API v2 exige PostgreSQL (Supabase OK).
#       Dans Render Dashboard, définir DATABASE_CONNECTION_URI
#       = ta DATABASE_URL Supabase + ?schema=evolution_api
# ============================================================

services:
  - type: web
    name: jarvis-evolution-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free

    envVars:
      - key: SERVER_URL
        value: https://jarvis-evolution-api.onrender.com

      - key: SERVER_PORT
        value: "8080"

      - key: AUTHENTICATION_API_KEY
        value: jarvis-evolution-2026

      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "true"

      - key: WEBHOOK_GLOBAL_ENABLED
        value: "true"

      - key: WEBHOOK_GLOBAL_URL
        value: https://n8n-ajs5.onrender.com/webhook/jarvis-wa-evolution

      - key: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
        value: "false"

      # --- PostgreSQL (obligatoire en v2) ---
      - key: DATABASE_PROVIDER
        value: postgresql

      # À renseigner dans le dashboard Render (ne pas committer le secret) :
      # postgresql://...@....pooler.supabase.com:5432/postgres?schema=evolution_api
      - key: DATABASE_CONNECTION_URI
        sync: false

      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: jarvis_evolution

      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"

      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"

      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"

      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"

      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"

      # Cache local (pas besoin de Redis sur Render Free)
      - key: CACHE_REDIS_ENABLED
        value: "false"

      - key: CACHE_LOCAL_ENABLED
        value: "true"

      - key: DEL_INSTANCE
        value: "false"

      - key: CONFIG_SESSION_PHONE_VERSION
        value: "2.3000.1023204200"

      - key: LOG_LEVEL
        value: "ERROR,WARN,INFO"

    disk:
      name: evolution-data
      mountPath: /evolution/instances
      sizeGB: 1
